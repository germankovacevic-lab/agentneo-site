<!doctype html>
<!-- Fuente del banner del sitio (banner.png EN / banner-es.png ES).
     Render: assets/render_banner.mjs (puppeteer, 1584x396 @2x = 3168x792).
     Para cambiar el número de agentes: editar las dos líneas .count y re-renderizar. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1584px;height:396px;overflow:hidden;position:relative;
    background:
      radial-gradient(700px 420px at 96% -10%, rgba(58,155,230,.16), transparent 70%),
      #101520;
    font-family:'Hanken Grotesk',sans-serif;
  }
  .dots{position:absolute;inset:0;
    background-image:radial-gradient(rgba(233,238,244,.055) 1.2px, transparent 1.2px);
    background-size:24px 24px;
    -webkit-mask-image:radial-gradient(90% 130% at 60% 40%, #000 30%, transparent 85%)}
  .block{position:absolute;right:56px;top:50%;transform:translateY(-50%);text-align:right}
  h1{font-family:'Sora',sans-serif;font-weight:800;font-size:73px;line-height:1.12;letter-spacing:-.015em;color:#F1F5FB}
  h1 .soft{color:#C9D4E0}
  h1 .blue{color:#4FA3E3}
  .rule{width:112px;height:6px;background:#39FF14;border-radius:3px;margin:20px 0 0 auto;box-shadow:0 0 18px rgba(57,255,20,.45)}
  .subtitle{margin-top:26px;font-size:27px;font-weight:500;color:#AEB9C6;letter-spacing:.005em}
  .subtitle b{color:#35C36B;font-weight:600}
  .es{display:none}
  body.lang-es .en{display:none}
  body.lang-es .es{display:block}
</style>
</head>
<body>
<div class="dots"></div>
<div class="block en">
  <h1>Real AI agents,<br><span class="soft">shipped and</span> <span class="blue">open-sourced.</span></h1>
  <div class="rule"></div>
  <div class="subtitle count">Eight live in production &nbsp;·&nbsp; <b>Meta Tech Provider</b> &nbsp;·&nbsp; open-source safety</div>
</div>
<div class="block es">
  <h1>Agentes de IA reales,<br><span class="soft">en producción y</span> <span class="blue">open-source.</span></h1>
  <div class="rule"></div>
  <div class="subtitle count">Ocho en producción &nbsp;·&nbsp; <b>Meta Tech Provider</b> &nbsp;·&nbsp; seguridad open-source</div>
</div>
</body>
</html>
